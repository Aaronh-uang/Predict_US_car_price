name: Refresh prices and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * 1"     # Mondays 14:17 UTC: refresh today's-market prices and the KBB check
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.11"

      - name: Install training dependencies
        id: deps
        if: github.event_name != 'push' && hashFiles('artifacts/model.txt') != ''
        run: pip install -r training/requirements.txt

      - name: Refresh ForCar calibration
        if: steps.deps.outcome == 'success'
        continue-on-error: true      # if ForCar is down, keep last week's numbers
        run: python training/calibrate.py

      - name: Score today's estimates against KBB
        if: steps.deps.outcome == 'success'
        continue-on-error: true      # if the sample is unavailable, keep last week's numbers
        run: python training/benchmark.py

      - name: Commit refreshed data
        if: steps.deps.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/calibration.json web/data/benchmark.json benchmark/
          git diff --cached --quiet || git commit -m "Weekly refresh: today's-market prices and KBB check"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Browser model matches LightGBM
        if: hashFiles('artifacts/parity_fixture.json') != ''
        run: node tests/parity.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
